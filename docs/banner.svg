<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Truss Equilibrium blueprint banner">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#12385f" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" fill="#0a223f"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect x="6" y="6" width="1188" height="288" fill="none" stroke="#3f6ea3" stroke-width="2"/>
  <!-- truss bridge blueprint -->
  <g transform="translate(80,60)" stroke="#cfe3f7" stroke-width="3" fill="none">
    <!-- bottom chord nodes: 0,1,2,3 -->
    <line x1="60" y1="170" x2="220" y2="170"/>
    <line x1="220" y1="170" x2="380" y2="170"/>
    <line x1="380" y1="170" x2="540" y2="170"/>
    <!-- top chord -->
    <line x1="140" y1="60" x2="300" y2="60"/>
    <line x1="300" y1="60" x2="460" y2="60"/>
    <!-- diagonals -->
    <line x1="60" y1="170" x2="140" y2="60"/>
    <line x1="140" y1="60" x2="220" y2="170"/>
    <line x1="220" y1="170" x2="300" y2="60"/>
    <line x1="300" y1="60" x2="380" y2="170"/>
    <line x1="380" y1="170" x2="460" y2="60"/>
    <line x1="460" y1="60" x2="540" y2="170"/>
    <!-- verticals -->
    <line x1="220" y1="170" x2="220" y2="96"/>
    <line x1="380" y1="170" x2="380" y2="96"/>
  </g>
  <g transform="translate(80,60)">
    <!-- nodes -->
    <g fill="#cfe3f7" stroke="#0a223f" stroke-width="2">
      <circle cx="60" cy="170" r="8"/><circle cx="220" cy="170" r="7"/><circle cx="380" cy="170" r="7"/><circle cx="540" cy="170" r="8"/>
      <circle cx="140" cy="60" r="7"/><circle cx="300" cy="60" r="7"/><circle cx="460" cy="60" r="7"/>
    </g>
    <!-- pin symbol at node 0 -->
    <path d="M 60 178 l -14 24 h 28 z" fill="none" stroke="#f0c987" stroke-width="2.5"/>
    <line x1="38" y1="206" x2="82" y2="206" stroke="#f0c987" stroke-width="2.5"/>
    <!-- roller symbol at node 3 -->
    <path d="M 540 178 l -14 20 h 28 z" fill="none" stroke="#f0c987" stroke-width="2.5"/>
    <circle cx="529" cy="203" r="4" fill="none" stroke="#f0c987" stroke-width="2"/>
    <circle cx="551" cy="203" r="4" fill="none" stroke="#f0c987" stroke-width="2"/>
    <!-- apex load arrow -->
    <line x1="300" y1="10" x2="300" y2="44" stroke="#e88a8a" stroke-width="3.5" marker-end="url(#tarr2)"/>
    <defs>
      <marker id="tarr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 8 5 L 0 9 z" fill="#e88a8a"/>
      </marker>
    </defs>
    <text x="316" y="24" fill="#e88a8a" font-family="Consolas, monospace" font-size="15">P</text>
    <!-- member force labels -->
    <text x="150" y="140" fill="#8fd8a0" font-family="Consolas, monospace" font-size="13">+T</text>
    <text x="255" y="130" fill="#8fb8f7" font-family="Consolas, monospace" font-size="13">−C</text>
    <text x="60" y="232" fill="#f0c987" font-family="Consolas, monospace" font-size="14">pin</text>
    <text x="516" y="232" fill="#f0c987" font-family="Consolas, monospace" font-size="14">roller</text>
  </g>
  <!-- blueprint title block, bottom-left -->
  <g font-family="'Courier New', monospace">
    <text x="40" y="272" fill="#cfe3f7" font-size="26" font-weight="700" letter-spacing="2">TRUSS EQUILIBRIUM</text>
    <text x="40" y="292" fill="#7fa8d0" font-size="14">DIRECT STIFFNESS · K u = f · RESIDUAL ~ 1e-11 N</text>
  </g>
</svg>
